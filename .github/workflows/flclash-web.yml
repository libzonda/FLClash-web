name: Build & Publish FlClash-web

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  schedule:
    # Check and build with latest upstream FlClash daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: 'Pull latest upstream chen08209/FlClash before building'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      upstream_ref:
        description: 'Upstream FlClash git ref/branch/tag to sync (when sync_upstream=true)'
        required: false
        default: 'main'
        type: string

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: flclash-web
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  SQLITE3_WASM_VERSION: '3.7.0'

jobs:
  build-binaries-and-web:
    name: Build Flutter Web & Standalone Binaries
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Use HTTPS for GitHub submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Sync latest upstream FlClash (if requested or scheduled)
        if: github.event_name == 'schedule' || inputs.sync_upstream == 'true'
        run: |
          UPSTREAM_REF="${{ inputs.upstream_ref || 'main' }}"
          echo "Syncing FlClash with upstream ref: ${UPSTREAM_REF}"
          git -C FlClash remote add upstream https://github.com/chen08209/FlClash.git 2>/dev/null || true
          git -C FlClash fetch upstream "${UPSTREAM_REF}" --depth=1
          git -C FlClash checkout FETCH_HEAD
          git -C FlClash submodule update --init --recursive

      - name: Extract version & build config
        id: meta
        run: |
          RAW_VER="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' FlClash/pubspec.yaml | head -n 1)"
          TAGS="$(sed -n 's/^tags: *//p' FlClash/build_config.yaml || echo 'with_gvisor')"
          echo "version=${RAW_VER:-0.8.0}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: FlClash/core/go.sum

      - name: Download sqlite3.wasm
        run: |
          mkdir -p FlClash/web
          curl -fsSL "https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-${SQLITE3_WASM_VERSION}/sqlite3.wasm" \
            -o FlClash/web/sqlite3.wasm

      - name: Apply FlClash-web adaptation & build Flutter Web
        run: |
          python3 scripts/prepare_web.py --apply
          cd FlClash
          flutter pub get
          flutter build web --release --no-tree-shake-icons --dart-define=APP_ENV=stable
          cd ..
          python3 scripts/prepare_web.py --revert

      - name: Embed Flutter Web assets & build standalone Linux binaries (amd64 & arm64)
        run: |
          rm -rf FlClash/core/cmd/flclash-web/web_dist
          mkdir -p FlClash/core/cmd/flclash-web/web_dist dist
          cp -r FlClash/build/web/. FlClash/core/cmd/flclash-web/web_dist/

          cd FlClash/core
          for ARCH in amd64 arm64; do
            echo "Building FlClash-web-linux-${ARCH}..."
            CGO_ENABLED=0 GOOS=linux GOARCH="${ARCH}" \
              go build -trimpath -tags "${{ steps.meta.outputs.tags }}" -ldflags "-w -s" \
              -o "../../dist/FlClash-web-linux-${ARCH}" ./cmd/flclash-web
            chmod +x "../../dist/FlClash-web-linux-${ARCH}"
          done

      - name: Upload standalone binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flclash-web-linux-binaries
          path: dist/FlClash-web-linux-*
          retention-days: 14

      - name: Upload compiled Flutter Web dist
        uses: actions/upload-artifact@v4
        with:
          name: flclash-web-static-dist
          path: FlClash/build/web
          retention-days: 7

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FlClash-web-linux-amd64
            dist/FlClash-web-linux-arm64
          generate_release_notes: true

  docker-publish:
    name: Build & Push Docker Image (GHCR & Docker Hub)
    needs: build-binaries-and-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download prebuilt standalone binaries
        uses: actions/download-artifact@v4
        with:
          name: flclash-web-linux-binaries
          path: dist

      - name: Generate fast multi-arch runtime Dockerfile from prebuilt binaries
        run: |
          cat << 'EOF' > Dockerfile.ci
          FROM alpine:3.20
          ARG TARGETARCH
          LABEL org.opencontainers.image.title="FlClash-web" \
                org.opencontainers.image.description="FlClash compiled to native Flutter Web with embedded Clash.Meta core"
          RUN apk add --no-cache ca-certificates iproute2 iptables nftables tzdata && \
              mkdir -p /data /usr/share/flclash
          COPY dist/FlClash-web-linux-${TARGETARCH} /usr/local/bin/FlClash-web
          RUN chmod +x /usr/local/bin/FlClash-web && \
              ln -sf /usr/local/bin/FlClash-web /usr/local/bin/FlClash
          ENV FLCLASH_WEB_LISTEN="0.0.0.0:9090" \
              FLCLASH_DATA_DIR="/data"
          VOLUME ["/data"]
          EXPOSE 9090 7890
          ENTRYPOINT ["/usr/local/bin/FlClash-web"]
          CMD ["--listen", "0.0.0.0:9090", "--data-dir", "/data"]
          EOF

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DH_USER}" ] && [ -n "${DH_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ steps.dockerhub.outputs.enabled == 'true' && format('docker.io/{0}/{1}', secrets.DOCKERHUB_USERNAME, env.IMAGE_NAME) || '' }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ needs.build-binaries-and-web.outputs.version }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push single-container Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

