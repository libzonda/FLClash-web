name: Build & Publish FlClash-web

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Target upstream FlClash tag (leave "latest" for newest stable release, e.g. v0.9.2)'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: flclash-web
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  SQLITE3_WASM_VERSION: '3.7.0'

jobs:
  build-binaries-and-web:
    name: Build Flutter Web & Standalone Binaries
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Use HTTPS for GitHub submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: FlClash/core/go.sum

      - name: Build Web & Standalone Binaries via build.sh
        id: build
        env:
          FLCLASH_TAG: ${{ inputs.upstream_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'latest' }}
          BUILD_ARCHS: "amd64 arm64"
        run: |
          ./build.sh
          RAW_VER="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' FlClash/pubspec.yaml | head -n 1)"
          VERSION="${RAW_VER:-0.9.2}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice title=FlClash Upstream Version::Built FlClash-web v${VERSION}"

      - name: Upload standalone binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flclash-web-${{ steps.build.outputs.version }}-linux
          path: dist/FlClash-web*
          retention-days: 14

      - name: Upload compiled Flutter Web dist
        uses: actions/upload-artifact@v4
        with:
          name: flclash-web-${{ steps.build.outputs.version }}-static-dist
          path: FlClash/build/web
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.build.outputs.version }}"
          name: "FlClash-web v${{ steps.build.outputs.version }}"
          files: |
            dist/FlClash-web-${{ steps.build.outputs.version }}-linux-amd64.tar.gz
            dist/FlClash-web-${{ steps.build.outputs.version }}-linux-arm64.tar.gz
            dist/FlClash-web-${{ steps.build.outputs.version }}-linux-amd64
            dist/FlClash-web-${{ steps.build.outputs.version }}-linux-arm64
            dist/FlClash-web-${{ steps.build.outputs.version }}-checksums.txt
          generate_release_notes: true

  docker-publish:
    name: Build & Push Docker Image (GHCR & Docker Hub)
    needs: build-binaries-and-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download prebuilt standalone binaries
        uses: actions/download-artifact@v4
        with:
          name: flclash-web-${{ needs.build-binaries-and-web.outputs.version }}-linux
          path: dist

      - name: Generate fast multi-arch runtime Dockerfile from prebuilt binaries
        run: |
          cat << 'EOF' > Dockerfile.ci
          FROM alpine:3.20
          ARG TARGETARCH
          LABEL org.opencontainers.image.title="FlClash-web" \
                org.opencontainers.image.description="FlClash compiled to native Flutter Web with embedded Clash.Meta core"
          RUN apk add --no-cache ca-certificates iproute2 iptables nftables tzdata && \
              mkdir -p /data /usr/share/flclash
          COPY dist/FlClash-web-linux-${TARGETARCH} /usr/local/bin/FlClash-web
          RUN chmod +x /usr/local/bin/FlClash-web && \
              ln -sf /usr/local/bin/FlClash-web /usr/local/bin/FlClash
          ENV FLCLASH_WEB_LISTEN="0.0.0.0:9090" \
              FLCLASH_DATA_DIR="/data"
          VOLUME ["/data"]
          EXPOSE 9090 7890
          ENTRYPOINT ["/usr/local/bin/FlClash-web"]
          CMD ["--listen", "0.0.0.0:9090", "--data-dir", "/data"]
          EOF

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DH_USER}" ] && [ -n "${DH_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ steps.dockerhub.outputs.enabled == 'true' && format('docker.io/{0}/{1}', secrets.DOCKERHUB_USERNAME, env.IMAGE_NAME) || '' }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ needs.build-binaries-and-web.outputs.version }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push single-container Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sync README to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          readme-filepath: ./README_DOCKER.md
          short-description: "A Flutter Web build of FlClash."
          enable-url-completion: true

