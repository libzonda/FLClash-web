name: Build & Publish FlClash-web

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Target upstream FlClash tag (leave "latest" for newest stable release, e.g. v0.9.2)'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: flclash-web
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  SQLITE3_WASM_VERSION: '3.7.0'

jobs:
  build-binaries-and-web:
    name: Build Flutter Web & Standalone Binaries
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      flclash_tag: ${{ steps.meta.outputs.flclash_tag }}
    steps:
      - name: Use HTTPS for GitHub submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve and checkout upstream FlClash release tag
        id: meta
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git -C FlClash remote add upstream https://github.com/chen08209/FlClash.git 2>/dev/null || true
          git -C FlClash fetch upstream --tags --depth=1

          INPUT_TAG="${{ inputs.upstream_tag || 'latest' }}"
          if [ "${INPUT_TAG}" = "latest" ]; then
            # Filter out pre-release and debug tags to get the latest formal release tag
            LATEST_TAG="$(git -C FlClash tag -l "v*" --sort="version:refname" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | tail -n 1)"
            if [ -z "${LATEST_TAG}" ]; then
              LATEST_TAG="$(git -C FlClash tag -l "v*" --sort="version:refname" | tail -n 1)"
            fi
            TARGET_TAG="${LATEST_TAG}"
          else
            TARGET_TAG="${INPUT_TAG}"
          fi

          echo "Targeting upstream FlClash tag: ${TARGET_TAG}"
          git -C FlClash checkout -q "${TARGET_TAG}"

          # Sync Clash.Meta submodule
          SUBMODULE_COMMIT="$(git -C FlClash ls-tree HEAD core/Clash.Meta 2>/dev/null | awk '{print $3}' || true)"
          if [ -n "${SUBMODULE_COMMIT}" ]; then
            echo "Syncing Clash.Meta submodule (${SUBMODULE_COMMIT})..."
            rm -rf FlClash/core/Clash.Meta FlClash/.git/modules/core/Clash.Meta
            mkdir -p FlClash/core/Clash.Meta
            git -C FlClash/core/Clash.Meta init
            git -C FlClash/core/Clash.Meta remote add origin https://github.com/chen08209/Clash.Meta.git
            git -C FlClash/core/Clash.Meta fetch --depth 1 origin "${SUBMODULE_COMMIT}"
            git -C FlClash/core/Clash.Meta checkout FETCH_HEAD
          fi

          RAW_VER="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' FlClash/pubspec.yaml | head -n 1)"
          TAGS="$(sed -n 's/^tags: *//p' FlClash/build_config.yaml || echo 'with_gvisor')"
          VERSION="${RAW_VER:-${TARGET_TAG#v}}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "flclash_tag=${TARGET_TAG}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "::notice title=FlClash Upstream Version::Building with FlClash tag ${TARGET_TAG} (version ${VERSION})"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: FlClash/core/go.sum

      - name: Download sqlite3.wasm
        run: |
          mkdir -p FlClash/web
          curl -fsSL "https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-${SQLITE3_WASM_VERSION}/sqlite3.wasm" \
            -o FlClash/web/sqlite3.wasm

      - name: Apply FlClash-web adaptation & build Flutter Web
        run: |
          python3 scripts/prepare_web.py --apply
          cd FlClash
          flutter pub get
          flutter build web --release --no-tree-shake-icons --dart-define=APP_ENV=stable --build-name="${{ steps.meta.outputs.version }}"
          cd ..
          python3 scripts/prepare_web.py --revert

      - name: Embed Flutter Web assets & build standalone Linux binaries (amd64 & arm64)
        run: |
          rm -rf FlClash/core/cmd/flclash-web/web_dist
          mkdir -p FlClash/core/cmd/flclash-web/web_dist dist
          cp -r FlClash/build/web/. FlClash/core/cmd/flclash-web/web_dist/

          VER="${{ steps.meta.outputs.version }}"
          cd FlClash/core
          for ARCH in amd64 arm64; do
            echo "Building FlClash-web for linux-${ARCH} (v${VER})..."
            CGO_ENABLED=0 GOOS=linux GOARCH="${ARCH}" \
              go build -trimpath -tags "${{ steps.meta.outputs.tags }}" \
              -ldflags "-w -s -X main.Version=${VER}" \
              -o "../../dist/FlClash-web-${VER}-linux-${ARCH}" ./cmd/flclash-web
            chmod +x "../../dist/FlClash-web-${VER}-linux-${ARCH}"

            # Standard compatibility copy for Dockerfile.ci and general use
            cp -f "../../dist/FlClash-web-${VER}-linux-${ARCH}" "../../dist/FlClash-web-linux-${ARCH}"

            # Package tar.gz release bundle
            tar -czf "../../dist/FlClash-web-${VER}-linux-${ARCH}.tar.gz" \
              -C "../../dist" "FlClash-web-${VER}-linux-${ARCH}"
          done

          cd ../../dist
          sha256sum FlClash-web-${VER}-linux-* > "FlClash-web-${VER}-checksums.txt"

      - name: Upload standalone binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flclash-web-${{ steps.meta.outputs.version }}-linux
          path: |
            dist/FlClash-web*
          retention-days: 14

      - name: Upload compiled Flutter Web dist
        uses: actions/upload-artifact@v4
        with:
          name: flclash-web-${{ steps.meta.outputs.version }}-static-dist
          path: FlClash/build/web
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.meta.outputs.version }}"
          name: "FlClash-web v${{ steps.meta.outputs.version }}"
          files: |
            dist/FlClash-web-${{ steps.meta.outputs.version }}-linux-amd64.tar.gz
            dist/FlClash-web-${{ steps.meta.outputs.version }}-linux-arm64.tar.gz
            dist/FlClash-web-${{ steps.meta.outputs.version }}-linux-amd64
            dist/FlClash-web-${{ steps.meta.outputs.version }}-linux-arm64
            dist/FlClash-web-${{ steps.meta.outputs.version }}-checksums.txt
          generate_release_notes: true

  docker-publish:
    name: Build & Push Docker Image (GHCR & Docker Hub)
    needs: build-binaries-and-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download prebuilt standalone binaries
        uses: actions/download-artifact@v4
        with:
          name: flclash-web-${{ needs.build-binaries-and-web.outputs.version }}-linux
          path: dist

      - name: Generate fast multi-arch runtime Dockerfile from prebuilt binaries
        run: |
          cat << 'EOF' > Dockerfile.ci
          FROM alpine:3.20
          ARG TARGETARCH
          LABEL org.opencontainers.image.title="FlClash-web" \
                org.opencontainers.image.description="FlClash compiled to native Flutter Web with embedded Clash.Meta core"
          RUN apk add --no-cache ca-certificates iproute2 iptables nftables tzdata && \
              mkdir -p /data /usr/share/flclash
          COPY dist/FlClash-web-linux-${TARGETARCH} /usr/local/bin/FlClash-web
          RUN chmod +x /usr/local/bin/FlClash-web && \
              ln -sf /usr/local/bin/FlClash-web /usr/local/bin/FlClash
          ENV FLCLASH_WEB_LISTEN="0.0.0.0:9090" \
              FLCLASH_DATA_DIR="/data"
          VOLUME ["/data"]
          EXPOSE 9090 7890
          ENTRYPOINT ["/usr/local/bin/FlClash-web"]
          CMD ["--listen", "0.0.0.0:9090", "--data-dir", "/data"]
          EOF

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DH_USER}" ] && [ -n "${DH_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ steps.dockerhub.outputs.enabled == 'true' && format('docker.io/{0}/{1}', secrets.DOCKERHUB_USERNAME, env.IMAGE_NAME) || '' }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ needs.build-binaries-and-web.outputs.version }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push single-container Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sync README to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          readme-filepath: ./README.md
          short-description: "FlClash compiled to native Flutter Web with embedded Clash.Meta core (Single binary/container, No VNC)"
          enable-url-completion: true

